name: CI

# The point of this workflow is that `xlflow validate` is a merge gate.
# A config change that would produce a plausible-but-wrong workbook fails here,
# in the pull request, rather than in someone's reconciliation.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Unrelated globally-installed pytest plugins must not be able to break the
  # suite. Keeps CI and local runs behaving identically.
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11", "3.13"]
        include:
          - os: ubuntu-24.04
            python: "3.10"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install -e ".[dev]"

      - name: Generate sample exports
        run: python samples/make_samples.py

      - name: Validate config and headers (merge gate)
        run: xlflow validate

      - name: Run pipeline
        run: xlflow run

      - name: Require both output artifacts
        run: python -c "from pathlib import Path; paths = [Path('out/reconciliation.xlsx'), Path('out/reconciliation.manifest.json')]; assert all(p.is_file() and p.stat().st_size for p in paths), 'Missing or empty reconciliation artifact'"

      - name: Tests
        run: python -m pytest -q

      - name: Prove the safety net still rejects drifted headers
        shell: bash
        run: |
          python samples/make_samples.py --drift
          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(["xlflow", "validate"], capture_output=True, text=True, timeout=60)
          print(result.stdout)
          print(result.stderr, file=sys.stderr)
          if result.returncode != 1 or "unresolved" not in result.stdout.lower():
              sys.exit("Expected header-drift rejection, not a crash or a successful validation")
          print("Header drift correctly rejected.")
          PY

      - name: Upload workbook and manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reconciliation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            out/reconciliation.xlsx
            out/reconciliation.manifest.json
          if-no-files-found: error
          retention-days: 7

name: CI

# The point of this workflow is that `xlflow validate` is a merge gate.
# A config change that would produce a plausible-but-wrong workbook fails here,
# in the pull request, rather than in someone's reconciliation.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Unrelated globally-installed pytest plugins must not be able to break the
  # suite. Keeps CI and local runs behaving identically.
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Generate sample exports
        run: python samples/make_samples.py

      - name: Validate config and headers (merge gate)
        run: xlflow validate

      - name: Run pipeline
        run: xlflow run

      - name: Tests
        run: python -m pytest -q

      - name: Prove the safety net still rejects drifted headers
        shell: bash
        run: |
          python samples/make_samples.py --drift
          if xlflow validate; then
            echo "::error::validate PASSED on drifted headers - the safety net is broken"
            exit 1
          fi
          echo "Drift correctly rejected."

      - name: Upload workbook and manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reconciliation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            out/reconciliation.xlsx
            out/reconciliation.manifest.json
          if-no-files-found: warn
